<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Building Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        /* ===== ORIGINAL STYLES (unchanged) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, #1d4ed8 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #06b6d4 0%, transparent 35%),
                linear-gradient(135deg, #050816, #0b1225, #111827);
        }

        .bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .45;
        }

        .c1 {
            width: 300px;
            height: 300px;
            background: #2563eb;
            left: -80px;
            top: -80px;
        }

        .c2 {
            width: 260px;
            height: 260px;
            background: #06b6d4;
            right: -70px;
            bottom: -70px;
        }

        .c3 {
            width: 180px;
            height: 180px;
            background: #7c3aed;
            left: 60%;
            top: 18%;
        }

        .card {
            position: relative;
            z-index: 2;
            width: 460px;
            padding: 45px;
            border-radius: 24px;
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .12);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .1);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .logo {
            width: 280px;
            height: 140px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        h1 {
            color: #ffffff;
            margin-top: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #94a3b8;
            text-align: center;
            font-size: 13px;
            margin-top: 6px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #d7e3f4;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, .12);
            background: rgba(255, 255, 255, .05);
            color: white;
            font-size: 15px;
            transition: .3s;
        }

        .input-group input::placeholder {
            color: #8b9ab5;
        }

        .input-group input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, .15);
        }

        button {
            width: 100%;
            margin-top: 10px;
            height: 56px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: .25s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 99, 235, .35);
        }

        button:active {
            transform: scale(.98);
        }

        .loading,
        .error {
            display: none;
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .loading {
            color: #d5dff3;
        }

        .error {
            color: #ff8b8b;
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            color: #8b9ab5;
            font-size: 12px;
        }

        .logout-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 30;
            display: none;
            width: auto;
            height: auto;
            margin: 0;
            padding: 8px 14px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: rgba(15, 23, 42, 0.65);
            color: #e2e8f0;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.22);
            backdrop-filter: blur(10px);
            opacity: 0.8;
            transition: .2s ease;
        }

        .logout-btn:hover {
            background: rgba(30, 41, 59, 0.85);
            opacity: 1;
            transform: translateY(-1px);
        }

        /* ===== NEW: IFrame container ===== */
        #iframe-container {
            display: none;
            /* hidden until login */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            background: #0b1020;
        }

        #iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #iframe-loading {
            position: absolute;
            inset: 0;
            z-index: 11;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at 50% 40%, rgba(37, 99, 235, 0.18), transparent 35%),
                linear-gradient(135deg, #050816, #0b1225, #111827);
            color: #ffffff;
            text-align: center;
        }

        .loading-spinner {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.10);
            border-top-color: #38bdf8;
            border-right-color: #2563eb;
            animation: loadingSpin 1s linear infinite;
            margin-bottom: 28px;
        }

        .loading-title {
            font-size: 23px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        .loading-subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .loading-status {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .loading-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, .8);
            animation: loadingPulse 1.5s ease-in-out infinite;
        }

        .loading-progress {
            width: 250px;
            height: 3px;
            overflow: hidden;
            border-radius: 10px;
            background: rgba(255, 255, 255, .08);
        }

        .loading-progress-bar {
            width: 35%;
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #38bdf8, #2563eb);
            box-shadow: 0 0 12px rgba(56, 189, 248, .5);
            animation: loadingProgress 2s ease-in-out infinite;
        }

        .loading-secure {
            margin-top: 25px;
            color: #64748b;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        @keyframes loadingSpin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes loadingPulse {

            0%,
            100% {
                opacity: .35;
                transform: scale(.8);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes loadingProgress {
            0% {
                transform: translateX(-150%);
            }

            100% {
                transform: translateX(400%);
            }
        }
    </style>
</head>

<body>

    <div class="bg">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
    </div>

    <!-- Login Card -->
    <div class="card" id="login-card">
        <div class="logo">
            <img src="smart-building.webp" alt="Smart Building Logo">
        </div>
        <h1>Dashboard Login</h1>
        <div class="subtitle">Sign in to access the monitoring dashboard</div>

        <div class="input-group">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="Enter your username" autocomplete="username" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password"
                required>
        </div>

        <button id="loginBtn" onclick="handleLogin()">Login</button>
        <div id="loading" class="loading">Connecting to dashboard...</div>
        <div id="login-error" class="error">Invalid username or password.</div>
        <div class="footer">Secure Dashboard Access</div>
    </div>

    <button id="logoutBtn" class="logout-btn" type="button" onclick="logout()">Logout</button>

    <!-- IFrame container (hidden initially) -->
    <div id="iframe-container">
        <div id="iframe-loading">
            <div class="loading-spinner"></div>

            <div class="loading-title">
                Preparing your dashboard
            </div>

            <div class="loading-subtitle">
                Establishing a secure connection
            </div>

            <div class="loading-status">
                <span class="loading-dot"></span>
                <span>Connecting to dashboard...</span>
            </div>

            <div class="loading-progress">
                <div class="loading-progress-bar"></div>
            </div>

            <div class="loading-secure">
                Smart Building • Secure Connection
            </div>
        </div>
        <iframe id="dashboard-iframe" src=""></iframe>
    </div>

    <script>
        // GSAP animations – keep as is
        gsap.from(".card", { y: 40, opacity: 0, duration: 1, ease: "power3.out" });
        gsap.to(".c1", { x: 50, y: 30, repeat: -1, yoyo: true, duration: 10, ease: "sine.inOut" });
        gsap.to(".c2", { x: -40, y: -50, repeat: -1, yoyo: true, duration: 12, ease: "sine.inOut" });
        gsap.to(".c3", { y: 35, repeat: -1, yoyo: true, duration: 8, ease: "sine.inOut" });

        const AUTH_TOKEN_KEY = "smart-building-auth-token";

        function showLoginForm() {
            const card = document.getElementById("login-card");
            const container = document.getElementById("iframe-container");
            const iframe = document.getElementById("dashboard-iframe");
            const logoutBtn = document.getElementById("logoutBtn");
            const loading = document.getElementById("loading");
            const error = document.getElementById("login-error");

            loading.style.display = "none";
            error.style.display = "none";
            iframe.src = "";
            container.style.display = "none";
            logoutBtn.style.display = "none";

            card.style.display = "block";
            card.style.opacity = "1";
            card.style.transform = "scale(1)";
        }

        function logout() {
            localStorage.removeItem(AUTH_TOKEN_KEY);
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
            showLoginForm();
        }

        async function getBackendUrl() {
            const configRes = await fetch("config/backend.json?t=" + Date.now());
            if (!configRes.ok) throw new Error("Configuration file not found.");
            const config = await configRes.json();
            const backend = config.backend_url;
            if (!backend || backend === "http://localhost:1880") {
                throw new Error("Dashboard is currently unavailable.");
            }
            return backend;
        }

        function showDashboard(backend) {
            document.getElementById("login-card").style.display = "none";
            document.getElementById("iframe-container").style.display = "block";
            document.getElementById("logoutBtn").style.display = "block";

            const iframe = document.getElementById("dashboard-iframe");
            const loadingText = document.getElementById("iframe-loading");
            const adminSecret = new URLSearchParams(window.location.search).get("admin");
            iframe.src = adminSecret === "secret123"
                ? backend + "/?admin=" + encodeURIComponent(adminSecret)
                : backend + "/ui/";
            iframe.onload = function () { loadingText.style.display = "none"; };
            iframe.onerror = function () { loadingText.textContent = "Failed to load dashboard."; };
        }

        function reloadDashboard() {
            const iframe = document.getElementById("dashboard-iframe");

            if (!iframe || !iframe.src || iframe.src === window.location.href) {
                return;
            }

            // Do nothing if user is currently on login page
            const container = document.getElementById("iframe-container");

            if (container.style.display === "none") {
                return;
            }

            console.log("Reloading dashboard iframe...");

            const url = new URL(iframe.src);

            // Force a fresh iframe navigation
            url.searchParams.set("reconnect", Date.now());

            iframe.src = url.toString();
        }


        // Reload dashboard when the browser regains network connection
        window.addEventListener("online", function () {
            console.log("Network restored. Reconnecting dashboard...");
            reloadDashboard();
        });


        // Refresh dashboard connection every 30 minutes
        setInterval(function () {
            console.log("Scheduled dashboard reconnection...");
            reloadDashboard();
        }, 30 * 60 * 1000);

        async function restoreSession() {
            const token = localStorage.getItem(AUTH_TOKEN_KEY);
            if (!token) return;

            try {
                const backend = await getBackendUrl();
                const response = await fetch(backend + "/auth/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token })
                });
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error("Session expired");
                showDashboard(backend);
            } catch (_) {
                localStorage.removeItem(AUTH_TOKEN_KEY);
            }
        }

        async function handleLogin() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const loading = document.getElementById("loading");
            const error = document.getElementById("login-error");
            const btn = document.getElementById("loginBtn");

            loading.style.display = "none";
            error.style.display = "none";

            btn.disabled = true;
            btn.innerText = "Signing In…";
            loading.style.display = "block";

            try {
                // 1. FIRST: Fetch the backend URL from GitHub Pages
                const backend = await getBackendUrl();

                // 2. SECOND: Authenticate against the PROXY (using the tunnel URL)
                const authRes = await fetch(backend + "/auth", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const authData = await authRes.json();
                if (!authData.success) {
                    throw new Error(authData.message || "Invalid credentials");
                }

                localStorage.setItem(AUTH_TOKEN_KEY, authData.token);

                showDashboard(backend);

            } catch (err) {
                loading.style.display = "none";
                error.innerText = err.message;
                error.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Login";
            }
        }

        // Enter key support
        document.addEventListener("keydown", function (e) {
            if (e.key === "Enter") handleLogin();
        });

        restoreSession();
    </script>

</body>

</html>
